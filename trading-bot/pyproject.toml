[tool.poetry]
name = "trading-bot"
version = "0.1.0"
description = "Algorithmic trading bot — continued from Obsidian vault notes"
authors = []
packages = [{ include = "bot" }, { include = "strategies" }, { include = "backtest" }, { include = "risk" }]

[tool.poetry.dependencies]
python = "^3.10"
ccxt = "^4.0.0"
pandas = "^2.0.0"
numpy = "^1.24.0"
python-dotenv = "^1.0.0"
ta = "^0.10.2"
aiohttp = "^3.8.0"
loguru = "^0.7.0"
requests = "^2.31.0"
praw = "^7.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
trade = "bot.cli:main"
backtest = "backtest.runner:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
