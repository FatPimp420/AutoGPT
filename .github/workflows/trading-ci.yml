name: Trading Bot CI

on:
  push:
    branches:
      - main
      - claude/init-ruvflo-project-7UmHV
  pull_request:
    branches:
      - main
      - claude/init-ruvflo-project-7UmHV

jobs:
  trading-bot-tests:
    name: Trading Bot Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading-bot/pyproject.toml

      - name: Install trading-bot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest \
            pytest-asyncio \
            ccxt \
            pandas \
            numpy \
            python-dotenv \
            ta \
            aiohttp \
            loguru \
            requests \
            praw \
            scikit-learn
          pip install -e trading-bot/

      - name: Run trading-bot tests
        run: cd trading-bot && python -m pytest --tb=short

  forge-tests:
    name: Forge Trading Tests (poetry + pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "1.7.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: autogpts/forge/.venv
          key: forge-venv-${{ runner.os }}-py3.11-${{ hashFiles('autogpts/forge/poetry.lock') }}
          restore-keys: |
            forge-venv-${{ runner.os }}-py3.11-

      - name: Install forge dependencies
        working-directory: autogpts/forge
        run: poetry install --no-root

      - name: Run forge trading tests
        working-directory: autogpts/forge
        run: poetry run pytest forge/trading/test_trading.py --tb=short
